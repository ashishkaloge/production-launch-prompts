<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Fictional SaaS launch scorecard, before and after fixes</title>
  <desc id="description">A sample launch scorecard for Acme Notes. The baseline audit on commit 3f9c2a1 was not ready, scoring 68 out of 100 with two critical blockers and five high priority issues. After fixes, the second re-audit on commit c27a5f3 scored 86 out of 100 with no critical blockers and one accepted high priority issue. Closed: the note ownership check, the authorization tests, and four high priority fixes. Fictional data, not a certification.</desc>
  <rect width="1200" height="600" rx="24" fill="#f7f8fa"/>
  <rect x="32" y="32" width="1136" height="536" rx="18" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>

  <text x="72" y="88" fill="#667085" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">FICTIONAL SAMPLE</text>
  <text x="1128" y="88" fill="#667085" font-family="Arial, sans-serif" font-size="17" text-anchor="end">Not a certification</text>
  <text x="72" y="136" fill="#101828" font-family="Arial, sans-serif" font-size="34" font-weight="700">Acme Notes launch scorecard, before and after fixes</text>
  <text x="72" y="174" fill="#475467" font-family="Arial, sans-serif" font-size="20">Prompt 10 wrote the scorecard. The re-audit recorded what the fixes changed.</text>

  <rect x="72" y="204" width="480" height="210" rx="14" fill="#fff1f0" stroke="#fda29b"/>
  <text x="96" y="242" fill="#b42318" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1">BASELINE  ·  2026-06-04  ·  3f9c2a1</text>
  <text x="96" y="290" fill="#7a271a" font-family="Arial, sans-serif" font-size="34" font-weight="700">NOT READY</text>
  <text x="96" y="344" fill="#101828" font-family="Arial, sans-serif" font-size="40" font-weight="700">68 / 100</text>
  <text x="96" y="388" fill="#7a271a" font-family="Arial, sans-serif" font-size="20">2 critical blockers  ·  5 high priority</text>

  <line x1="568" y1="309" x2="616" y2="309" stroke="#98a2b3" stroke-width="4" stroke-linecap="round"/>
  <path d="M606 297 L622 309 L606 321" fill="none" stroke="#98a2b3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="648" y="204" width="480" height="210" rx="14" fill="#ecfdf3" stroke="#6ce9a6"/>
  <text x="672" y="242" fill="#027a48" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1">RE-AUDIT 2  ·  2026-06-10  ·  c27a5f3</text>
  <text x="672" y="290" fill="#054f31" font-family="Arial, sans-serif" font-size="34" font-weight="700">PRODUCTION READY</text>
  <text x="672" y="344" fill="#101828" font-family="Arial, sans-serif" font-size="40" font-weight="700">86 / 100</text>
  <text x="672" y="388" fill="#054f31" font-family="Arial, sans-serif" font-size="20">0 critical blockers  ·  1 high, accepted</text>

  <rect x="72" y="438" width="1056" height="102" rx="14" fill="#f9fafb" stroke="#e4e7ec"/>
  <text x="100" y="478" fill="#027a48" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1">CLOSED</text>
  <text x="232" y="478" fill="#101828" font-family="Arial, sans-serif" font-size="20">B1 note ownership check, B2 authorization tests, H1, H2, H3, H4</text>
  <text x="100" y="516" fill="#b54708" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1">STILL OPEN</text>
  <text x="232" y="516" fill="#101828" font-family="Arial, sans-serif" font-size="20">H5 inconsistent error responses, accepted until 2026-06-20</text>
</svg>
